name: Python checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile scripts
        run: python -m py_compile scripts/qc_analysis.py scripts/qc_pdf_report.py scripts/run_qc_pdf.py
      - name: Check entry-point help
        run: python scripts/run_qc_pdf.py --help

