name: Syntax checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install Python dependencies
        run: python -m pip install -r environment/requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile scripts/python/03_brain_region_pca.py
      - name: Validate Bash syntax
        run: bash -n run_all.sh
      - name: Validate R syntax
        run: Rscript -e "invisible(lapply(list.files('scripts/R', full.names = TRUE), parse))"
