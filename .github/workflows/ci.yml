name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sample-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
      - name: Install Python dependencies
        run: python -m pip install -r sample_analysis/environment/requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile sample_analysis/scripts/python/brain_region_pca.py
      - name: Validate Bash syntax
        run: bash -n sample_analysis/run_all.sh
      - name: Validate R syntax
        run: Rscript -e "invisible(lapply(list.files('sample_analysis/scripts/R', full.names = TRUE), parse))"

  qc-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r QC_analysis/requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile QC_analysis/scripts/qc_analysis.py QC_analysis/scripts/qc_pdf_report.py QC_analysis/scripts/run_qc_pdf.py
      - name: Check QC entry point
        run: python QC_analysis/scripts/run_qc_pdf.py --help
